name: Verify private research app
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      COLLECTORS_ENABLED: 'false'
      INTRADAY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip==26.3
          python -m pip install -r backend/requirements.lock
      - name: Unit and API checks (isolated database; no provider secrets)
        run: PYTHONPATH=backend python -m pytest backend/tests -q
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Type check and production build
        run: |
          npm --prefix frontend run typecheck
          NEXT_DIST_DIR=.next-build npm --prefix frontend run build
