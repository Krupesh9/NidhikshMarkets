[project]
name = "nidhiksh-markets"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0.36,<2.1",
 "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
 "openpyxl>=3.1,<4", "numpy>=2.2,<3", "pandas>=2.2,<4", "pwdlib[argon2]>=0.2,<1", "exchange-calendars>=4.9,<5"
]
[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "hypothesis>=6.120,<7"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
